name: CI PHP 8.2

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          # gd + exif + mbstring: các endpoint upload ảnh (api/upload_avatar|qua|anh.php) cần;
          # curl: tests/ApiHttpTest.php gọi endpoint qua HTTP thật.
          extensions: sqlite3, pdo_sqlite, gd, exif, mbstring, curl
          coverage: none

      # php2shell (CVE-2026-109618/109619, RCE không cần xác thực): chỉ 8.2.35+/8.3.36+/8.4.27+/8.5.12+ đã được vá.
      - name: Require patched PHP
        run: |
          php -r '$min = ["8.2" => "8.2.35", "8.3" => "8.3.36", "8.4" => "8.4.27", "8.5" => "8.5.12"];
            $b = PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION;
            exit(isset($min[$b]) && version_compare(PHP_VERSION, $min[$b], ">=") ? 0 : 1);'

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: PHP lint
        run: composer lint

      - name: PHPStan
        run: composer phpstan

      - name: PHPUnit
        run: composer test


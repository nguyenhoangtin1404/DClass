name: CI Flutter (mobile)

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/ci-flutter.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/ci-flutter.yml'

defaults:
  run:
    working-directory: mobile

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format check
        run: |
          dart format .
          git diff --exit-code

      - name: Analyze (lint)
        run: flutter analyze

      - name: Ensure libsqlite3 is present (sqflite_common_ffi needs it for tests)
        run: sudo apt-get update -y && sudo apt-get install -y libsqlite3-0

      - name: Run tests
        run: flutter test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Debug build: no signing config needed (see #102 for release signing,
      # which requires the app owner's own keystore secret). Good enough to
      # smoke-test that the app actually builds and to hand testers an APK.
      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dclass-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

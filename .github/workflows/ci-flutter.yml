name: CI Flutter (mobile)

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/ci-flutter.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/ci-flutter.yml'

defaults:
  run:
    working-directory: mobile

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze (lint)
        run: flutter analyze

      - name: Run tests
        run: flutter test

name: dclass_mobile
description: "DClass mobile companion app - fast in-class point add/redeem for teachers."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.0.0
  sqflite: ^2.3.0
  path: ^1.9.0
  uuid: ^4.4.0
  connectivity_plus: ^6.0.0
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.0
  flutter_secure_storage_platform_interface: ^1.1.2
  flutter_launcher_icons: ^0.14.4
  connectivity_plus_platform_interface: ^2.1.0
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  assets:
    - assets/brand/star.png
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700

# Run `dart run flutter_launcher_icons` to (re)generate android/ios launcher
# icons from assets/icon/icon.png once a real logo exists there - see
# assets/icon/README.md. Until then the app uses Flutter's default icon.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"

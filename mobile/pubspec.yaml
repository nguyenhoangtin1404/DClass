name: dclass_mobile
description: "DClass mobile companion app - fast in-class point add/redeem for teachers."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.0.0
  sqflite: ^2.3.0
  path: ^1.9.0
  uuid: ^4.4.0
  connectivity_plus: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.0
  flutter_secure_storage_platform_interface: ^1.1.2

flutter:
  uses-material-design: true
